<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stat Watch prototypes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anybody:wdth,wght@50..150,400..900&family=Archivo:wght@400;600;700&family=Big+Shoulders+Display:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;700&family=Red+Hat+Display:wght@600;700;800&family=Red+Hat+Text:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html{background:#e4e9f0}
html[data-theme=dark]{background:#0b1220}
body{margin:0}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--focus,#1f5fbf);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bump{animation:bump 900ms ease-out}
@keyframes bump{from{background:var(--bump)}to{background:transparent}}
@media (prefers-reduced-motion:reduce){.bump{animation:none}}
.press{transition:transform 120ms ease-out}
.press:active{transform:scale(.97)}

/* ---------- Variant 1: Broadcast ---------- */
.v1{--bg:#E4E9F0;--panel:#FFFFFF;--ink:#0D1B2E;--muted:#4F5F74;--rule:#CCD5E0;--bar:#0D1B2E;--barInk:#F4F7FB;--live:#C8102E;--bug:#F2B705;--bugInk:#1C1400;--bump:rgba(242,183,5,.6);--focus:#C8102E;
  font:16px/1.4 Archivo,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
[data-theme=dark] .v1{--bg:#070F1C;--panel:#0F1B2F;--ink:#E9EFF7;--muted:#9AAAC0;--rule:#1D2D48;--bar:#13233D;--bump:rgba(242,183,5,.4);--focus:#F2B705}
.v1 .top{background:var(--bar);color:var(--barInk)}
.v1 .wrap{max-width:1060px;margin:0 auto;padding:0 20px}
.v1 .top .wrap{display:flex;align-items:center;gap:10px;padding-top:14px;padding-bottom:14px}
.v1 .brand{font:italic 900 30px/1 'Big Shoulders Display';margin:0;flex:1}
.v1 .btn{font:700 15px/1 Archivo;border:0;border-radius:3px;padding:11px 14px;cursor:pointer}
.v1 .btn-primary{background:var(--bug);color:var(--bugInk)}
.v1 .btn-ghost{background:transparent;color:var(--barInk);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}
.v1 h2{font:800 22px/1 'Big Shoulders Display';margin:30px 0 10px;display:flex;align-items:center;gap:8px}
.v1 .dot{width:9px;height:9px;border-radius:50%;background:var(--live)}
.v1 ul{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.v1 .strip{display:grid;grid-template-columns:76px minmax(0,1fr) auto 112px;background:var(--panel);border-radius:4px;overflow:hidden}
.v1 .strip.is-rz{box-shadow:inset 0 -4px 0 var(--live)}
.v1 .tm{background:var(--team);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:'Big Shoulders Display';line-height:1;padding:10px 0}
.v1 .tm b{font-size:30px;font-weight:900}.v1 .tm span{font-size:15px;font-weight:800;opacity:.9}
.v1 .who{padding:12px 16px;min-width:0}
.v1 .nm{font:800 27px/1.05 'Big Shoulders Display';margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v1 .meta{color:var(--muted);font-size:14px;margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:center}
.v1 .rz{background:var(--live);color:#fff;font-weight:700;font-size:13px;padding:2px 8px;border-radius:2px}
.v1 .lg{color:var(--ink);font-weight:600}
.v1 .rm{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:13px}
.v1 .stats{display:flex;gap:22px;align-items:center;padding:0 20px}
.v1 .stat b{display:block;font:700 26px/1 'Big Shoulders Display';font-variant-numeric:tabular-nums;border-radius:2px}
.v1 .stat span{font-size:12px;color:var(--muted)}
.v1 .bug{background:var(--bug);color:var(--bugInk);display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;cursor:pointer;gap:3px}
.v1 .bug b{font:900 36px/1 'Big Shoulders Display';font-variant-numeric:tabular-nums}
.v1 .bug span{font-size:12px;font-weight:700}
.v1 .play{font-size:14px;color:var(--muted);margin-top:4px}
.v1 .brk{background:var(--panel);border-radius:4px;padding:12px 20px 14px 96px;margin-top:-4px;display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 24px;font-size:14px}
.v1 .brk div{display:flex;justify-content:space-between;border-bottom:1px solid var(--rule);padding:4px 0}
.v1 .empty{background:var(--panel);border-radius:4px;padding:40px;text-align:center;margin-top:30px}
@media (max-width:760px){
  .v1 .strip{grid-template-columns:60px minmax(0,1fr) 92px}
  .v1 .stats{grid-column:1/-1;grid-row:2;flex-wrap:wrap;gap:10px 20px;padding:10px 16px;border-top:1px solid var(--rule)}
  .v1 .brk{padding-left:16px}
  .v1 .nm{font-size:23px}
}

/* ---------- Variant 2: Ledger ---------- */
.v2{--bg:#F2F4F1;--panel:#FFFFFF;--ink:#1A1F24;--muted:#58626B;--rule:#DCE1DB;--head:#E7EBE5;--good:#1B7347;--live:#B93A0B;--accent:#1F5FBF;--bump:rgba(27,115,71,.22);--focus:#1F5FBF;
  font:15px/1.45 'Red Hat Text',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
[data-theme=dark] .v2{--bg:#121619;--panel:#191E23;--ink:#E4E8EB;--muted:#9CA6AF;--rule:#2A3138;--head:#1F252B;--good:#56C68B;--live:#FB8C4C;--accent:#82AEF5;--bump:rgba(86,198,139,.22);--focus:#82AEF5}
.v2 .wrap{max-width:1100px;margin:0 auto;padding:0 20px}
.v2 header.wrap{display:flex;align-items:center;gap:10px;padding-top:22px;padding-bottom:10px}
.v2 h1{font:800 24px/1 'Red Hat Display';margin:0;flex:1}
.v2 .btn{font:600 14px/1 'Red Hat Text';border-radius:6px;padding:10px 14px;cursor:pointer;border:1px solid var(--rule);background:var(--panel)}
.v2 .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.v2 .totals{display:flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:8px;background:var(--panel);margin:8px 0 20px}
.v2 .tot{padding:12px 18px;border-right:1px solid var(--rule);min-width:180px}
.v2 .tot:last-child{border-right:0}
.v2 .tot b{display:block;font:700 26px/1.1 'Red Hat Display';font-variant-numeric:tabular-nums}
.v2 .tot span{color:var(--muted);font-size:13px}
.v2 .game{background:var(--panel);border:1px solid var(--rule);border-radius:8px;margin-bottom:14px;overflow:hidden}
.v2 .gh{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 14px;padding:10px 14px;background:var(--head);border-bottom:1px solid var(--rule)}
.v2 .gh h2{font:700 16px/1.2 'Red Hat Display';margin:0;font-variant-numeric:tabular-nums}
.v2 .st{font-size:13px;color:var(--muted)}
.v2 .st.live{color:var(--live);font-weight:700}
.v2 .rz{font-size:12px;font-weight:700;color:var(--panel);background:var(--live);padding:2px 7px;border-radius:4px}
.v2 .play{flex-basis:100%;font-size:13px;color:var(--muted)}
.v2 table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;table-layout:fixed}
.v2 th:nth-child(1){width:30%}.v2 th:nth-child(2){width:16%}.v2 th:nth-child(4){width:96px}.v2 th:nth-child(5){width:48px}
@media (max-width:700px){.v2 th:nth-child(1){width:42%}.v2 th:nth-child(4){width:72px}.v2 th:nth-child(5){width:40px}.v2 .line span{display:inline-block}}
.v2 th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:8px 14px;border-bottom:1px solid var(--rule)}
.v2 td{padding:9px 14px;border-bottom:1px solid var(--rule);vertical-align:middle}
.v2 tr:last-child td{border-bottom:0}
.v2 .pl b{font-weight:700}.v2 .pl small{color:var(--muted);margin-left:6px}
.v2 tr.is-rz .pl b{box-shadow:inset 0 -2px 0 var(--live)}
.v2 .line span{margin-right:14px;white-space:nowrap}
.v2 .line i{font-style:normal;color:var(--muted);margin-left:3px;font-size:13px}
.v2 .num{text-align:right}
.v2 .pts{border:0;background:none;cursor:pointer;font:700 17px/1 'Red Hat Display';font-variant-numeric:tabular-nums;color:var(--good);padding:4px 6px;border-radius:4px}
.v2 .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px;line-height:1;padding:4px 6px;border-radius:4px}
.v2 .brk td{background:var(--head);font-size:13px}
.v2 .brk dl{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 24px;margin:0}
.v2 .brk dl div{display:flex;justify-content:space-between}
.v2 .brk dd{margin:0;font-weight:700}
.v2 .empty{border:1px dashed var(--rule);border-radius:8px;padding:40px;text-align:center}
@media (max-width:700px){
  .v2 .lgc{display:none}
  .v2 .line span{margin-right:10px}
  .v2 td,.v2 th{padding-left:10px;padding-right:10px}
  .v2 .tot{min-width:50%;border-right:0;border-bottom:1px solid var(--rule)}
}
@media (min-width:701px){.v2 .lgm{display:none}}

/* ---------- Variant 3: Field ---------- */
.v3{--bg:#E8F0E4;--panel:#FFFFFF;--ink:#132016;--muted:#4F6555;--rule:#D2DFCD;--turf:#3B8A46;--turf2:#357F40;--pylon:#E85D0C;--accent:#14532D;--bump:rgba(255,106,19,.28);--focus:#14532D;
  font:15px/1.45 'Hanken Grotesk',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:110px}
[data-theme=dark] .v3{--bg:#0B1810;--panel:#122319;--ink:#E5EFE6;--muted:#9CB3A1;--rule:#21382A;--turf:#1F5A2A;--turf2:#1B5126;--pylon:#FF7A2E;--accent:#86EFAC;--bump:rgba(255,106,19,.32);--focus:#86EFAC}
.v3 .wrap{max-width:1180px;margin:0 auto;padding:0 20px}
.v3 header.wrap{display:flex;align-items:center;gap:10px;padding-top:22px;padding-bottom:6px}
.v3 h1{font:900 30px/1 Anybody;font-stretch:140%;margin:0;flex:1;letter-spacing:-.01em}
.v3 .btn{font:700 14px/1 'Hanken Grotesk';border-radius:999px;padding:11px 16px;cursor:pointer;border:1px solid var(--rule);background:var(--panel)}
.v3 .btn-primary{background:var(--accent);border-color:var(--accent);color:var(--panel)}
.v3 h2{font:800 17px/1 Anybody;font-stretch:120%;margin:26px 0 12px;color:var(--muted)}
.v3 .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(300px,100%),1fr));gap:14px;list-style:none;margin:0;padding:0}
.v3 .grid.live{grid-template-columns:repeat(auto-fill,minmax(min(470px,100%),1fr))}
.v3 .card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.v3 .card.is-rz{border-color:var(--pylon);box-shadow:0 0 0 1px var(--pylon)}
.v3 .hd{display:flex;align-items:center;gap:12px}
.v3 .badge{width:42px;height:42px;border-radius:50%;background:var(--team);color:#fff;display:grid;place-items:center;font:800 13px/1 Anybody;font-stretch:110%;flex:none}
.v3 .id{flex:1;min-width:0}
.v3 .nm{font:800 19px/1.15 Anybody;font-stretch:108%;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v3 .sub{color:var(--muted);font-size:13px;display:flex;gap:10px;flex-wrap:wrap}
.v3 .chip{font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--bg);color:var(--ink)}
.v3 .pts{border:0;background:none;cursor:pointer;text-align:right;padding:2px 4px;border-radius:8px}
.v3 .pts b{display:block;font:900 38px/1 Anybody;font-stretch:135%;font-variant-numeric:tabular-nums;border-radius:6px}
.v3 .pts span{font-size:12px;color:var(--muted)}
.v3 .grid:not(.live) .pts b{font-size:28px;font-stretch:115%}
.v3 .grid:not(.live) .nm{white-space:normal}
.v3 .field{position:relative;height:46px;border-radius:8px;overflow:hidden;background:repeating-linear-gradient(90deg,var(--turf) 0 4.1667%,var(--turf2) 4.1667% 8.3333%)}
.v3 .ez{position:absolute;top:0;bottom:0;width:8.3333%;display:grid;place-items:center;color:#fff;font:800 11px/1 Anybody}
.v3 .ez.l{left:0;background:var(--own)}.v3 .ez.r{right:0;background:var(--opp)}
.v3 .rzone{position:absolute;top:0;bottom:0;left:75%;width:16.6667%;background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(255,106,19,.4) 6px 8px)}
.v3 .ballrail{position:absolute;inset:0;transition:transform 600ms cubic-bezier(.645,.045,.355,1)}
@media (prefers-reduced-motion:reduce){.v3 .ballrail{transition:none}}
.v3 .los{position:absolute;top:0;bottom:0;left:0;width:2px;background:#5BB8FF}
.v3 .ball{position:absolute;top:50%;left:-7px;width:15px;height:10px;margin-top:-5px;border-radius:50%;background:#7B3F1D;box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.v3 .dd{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:var(--muted);flex-wrap:wrap}
.v3 .dd b{color:var(--ink)}
.v3 .rzt{color:var(--pylon);font-weight:800}
.v3 .stats{display:flex;flex-wrap:wrap;gap:8px 18px}
.v3 .stat b{display:block;font:800 20px/1.1 Anybody;font-stretch:115%;font-variant-numeric:tabular-nums;border-radius:4px}
.v3 .stat span{font-size:12px;color:var(--muted)}
.v3 .score{font-size:14px;color:var(--muted)}
.v3 .score b{color:var(--ink)}
.v3 .ft{display:flex;justify-content:flex-end}
.v3 .rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;text-decoration:underline;padding:0}
.v3 .brk{border-top:1px solid var(--rule);padding-top:10px;display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:2px 20px;font-size:13px}
.v3 .brk div{display:flex;justify-content:space-between}
.v3 .empty{background:var(--panel);border-radius:16px;padding:40px;text-align:center;margin-top:24px}

/* ---------- Add dialog (inherits the active variant's tokens via body class) ---------- */
dialog{border:0;padding:0;border-radius:12px;width:min(560px,calc(100vw - 32px));background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(5,10,20,.5)}
dialog[open]{animation:dlg 180ms ease-out}
@keyframes dlg{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){dialog[open]{animation:none}}
.dlg{padding:20px;display:grid;gap:14px}
.dlg header{display:flex;align-items:center;justify-content:space-between}
.dlg h2{margin:0;font-size:20px}
.dlg .close{border:0;background:none;font-size:24px;cursor:pointer;line-height:1;padding:4px 8px;border-radius:6px}
.dlg label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.dlg input,.dlg select{font:inherit;font-size:16px;padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--ink)}
.dlg ul{list-style:none;margin:0;padding:0;max-height:300px;overflow:auto;display:grid;gap:2px}
.dlg li{display:flex;align-items:center;gap:10px;padding:8px 6px;border-bottom:1px solid var(--rule)}
.dlg li .r{flex:1}.dlg li small{color:var(--muted);margin-left:6px}
.dlg .add{border:1px solid var(--rule);background:var(--bg);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:700}
.dlg .add:disabled{opacity:.55;cursor:default}
.dlg .none{color:var(--muted);padding:12px 6px}
body[data-variant="1"] .dlg h2{font:800 26px/1 'Big Shoulders Display'}
body[data-variant="2"] .dlg h2{font:700 20px/1.2 'Red Hat Display'}
body[data-variant="3"] .dlg h2{font:800 20px/1.2 Anybody;font-stretch:115%}

/* ---------- Picker (verbatim spec) ---------- */
.proto-picker{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:2147483647;display:flex;align-items:center;gap:2px;padding:4px;border-radius:999px;background:rgba(10,10,10,.82);-webkit-backdrop-filter:blur(12px) saturate(1.4);backdrop-filter:blur(12px) saturate(1.4);box-shadow:0 0 0 1px rgba(255,255,255,.08) inset,0 8px 24px rgba(0,0,0,.24),0 2px 6px rgba(0,0,0,.12);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-size:13px;line-height:1;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
.proto-picker-highlight{position:absolute;top:4px;left:0;height:28px;border-radius:999px;background:rgba(255,255,255,.12);will-change:transform}
.proto-picker[data-ready] .proto-picker-highlight{transition:transform 250ms cubic-bezier(.23,1,.32,1),width 250ms cubic-bezier(.23,1,.32,1)}
@media (prefers-reduced-motion:reduce){.proto-picker[data-ready] .proto-picker-highlight{transition:none}}
.proto-picker-item{position:relative;display:flex;align-items:center;height:28px;padding:0 12px;border:0;border-radius:999px;background:transparent;color:rgba(255,255,255,.55);font:inherit;cursor:pointer;transition:color 150ms ease-out}
.proto-picker-item:hover{color:rgba(255,255,255,.85)}
.proto-picker-item:active{transform:scale(.97)}
.proto-picker-item:focus-visible{outline:2px solid rgba(255,255,255,.4);outline-offset:2px}
.proto-picker-item[data-active]{color:#fff}
</style>
</head>
<body>
<div id="stage"></div>

<dialog id="add" aria-labelledby="add-title">
  <form method="dialog" class="dlg">
    <header><h2 id="add-title">Add a player or defense</h2><button class="close" value="close" aria-label="Close">×</button></header>
    <label>Search<input id="q" type="search" placeholder="Name or team, for example Purdy or BUF" autocomplete="off"></label>
    <label>League<select id="pf"></select></label>
    <ul id="results" aria-live="polite"></ul>
  </form>
</dialog>

<nav class="proto-picker" aria-label="Prototype variants">
  <span class="proto-picker-highlight" aria-hidden="true"></span>
  <button class="proto-picker-item" data-active aria-current="true">Broadcast</button>
  <button class="proto-picker-item">Ledger</button>
  <button class="proto-picker-item">Field</button>
</nav>

<script>

  chase:{name:"Ja'Marr Chase",pos:'WR',team:'CIN',num:1,s:{rec:{rec:8,tgt:10,yds:121,td:1},rush:{att:1,yds:6,td:0}}},
  aubrey:{name:'Brandon Aubrey',pos:'K',team:'DAL',num:17,s:{kick:{fg:[52,47,33],fgMiss:0,xp:2,xpMiss:0}}},

  bijan:{name:'Bijan Robinson',pos:'RB',team:'ATL',num:7,s:null},
  allen:{name:'Josh Allen',pos:'QB',team:'BUF',num:17,s:{pass:{cmp:24,att:33,yds:268,td:2,int:1},rush:{att:7,yds:41,td:1}}},
  barkley:{name:'Saquon Barkley',pos:'RB',team:'PHI',num:26,s:{rush:{att:21,yds:112,td:1},rec:{rec:3,tgt:4,yds:19,td:0}}},
  nacua:{name:'Puka Nacua',pos:'WR',team:'LAR',num:12,s:{rec:{rec:9,tgt:12,yds:104,td:0}}},
  parsons:{name:'Micah Parsons',pos:'LB',team:'GB',num:1,s:{idp:{solo:3,ast:1,sack:1.5,tfl:2,qbHit:3,pd:0,int:0,fr:0,td:0}}},
  buf:{name:'Buffalo Bills',pos:'D/ST',team:'BUF',s:{dst:{sack:3,int:1,fr:0,td:0,safety:0}}},
  phi:{name:'Philadelphia Eagles',pos:'D/ST',team:'PHI',s:{dst:{sack:2,int:1,fr:1,td:0,safety:0}}}
};
const BASE={passYd:.04,passTd:4,int:-2,rushYd:.1,rushTd:6,rec:1,recYd:.1,recTd:6,fg0:3,fg40:4,fg50:5,fgMiss:-1,xp:1,
  solo:1,ast:.5,sack:2,tfl:1,qbHit:.5,pd:1,dInt:3,fr:2,dTd:6,stSack:1,stInt:2,stFr:2,stTd:6,stSafety:2,pa:[10,7,4,1,0,-1,-4]};
const PROFILES={office:{name:'Office league',v:{...BASE}},friends:{name:'Friends league',v:{...BASE,passTd:6,rec:.5}}};

const state={variant:0,open:new Set(),followed:[
  {id:'purdy',pid:'office'},{id:'purdy',pid:'friends'},{id:'cmc',pid:'office'},{id:'warner',pid:'office'},
  {id:'chase',pid:'friends'},{id:'aubrey',pid:'friends'},{id:'bal',pid:'friends'},{id:'bijan',pid:'office'}]};

// ---------- Scoring ----------
const tier=(pa,t)=>pa===0?t[0]:pa<=6?t[1]:pa<=13?t[2]:pa<=20?t[3]:pa<=27?t[4]:pa<=34?t[5]:t[6];
function score(id,pid){
  const p=PROFILES[pid].v,c=CATALOG[id],s=c.s,parts=[];
  if(!s)return{total:0,parts};
  const add=(l,v)=>{if(v)parts.push([l,v])};
  if(s.pass){add('Passing yards',s.pass.yds*p.passYd);add('Passing TDs',s.pass.td*p.passTd);add('Interceptions',s.pass.int*p.int)}
  if(s.rush){add('Rushing yards',s.rush.yds*p.rushYd);add('Rushing TDs',s.rush.td*p.rushTd)}
  if(s.rec){add('Receptions',s.rec.rec*p.rec);add('Receiving yards',s.rec.yds*p.recYd);add('Receiving TDs',s.rec.td*p.recTd)}
  if(s.kick){s.kick.fg.forEach(d=>add(d+'-yard field goal',d>=50?p.fg50:d>=40?p.fg40:p.fg0));add('Missed field goals',s.kick.fgMiss*p.fgMiss);add('Extra points',s.kick.xp*p.xp)}
  if(s.idp){const d=s.idp;add('Solo tackles',d.solo*p.solo);add('Assisted tackles',d.ast*p.ast);add('Sacks',d.sack*p.sack);add('Tackles for loss',d.tfl*p.tfl);add('QB hits',d.qbHit*p.qbHit);add('Passes defended',d.pd*p.pd);add('Interceptions',d.int*p.dInt);add('Fumble recoveries',d.fr*p.fr);add('Defensive TDs',d.td*p.dTd)}
  if(s.dst){const d=s.dst,g=GAMES[TEAM_GAME[c.team]],pa=g.home===c.team?g.as:g.hs;add('Sacks',d.sack*p.stSack);add('Interceptions',d.int*p.stInt);add('Fumble recoveries',d.fr*p.stFr);add('Touchdowns',d.td*p.stTd);add('Safeties',d.safety*p.stSafety);add(pa+' points allowed',tier(pa,p.pa))}
  return{total:parts.reduce((a,[,v])=>a+v,0),parts};
}
const fmt=n=>n.toFixed(2);
const sgn=n=>(n>0?'+':n<0?'-':'')+Math.abs(n).toFixed(2);

// ---------- View model ----------
function chunks(c){
  const s=c.s;if(!s)return[];
  switch(c.pos){
    case'QB':return[[s.pass.cmp+'/'+s.pass.att,'comp'],[s.pass.yds,'pass yds'],[s.pass.td,'pass TD'],[s.pass.int,'INT'],[s.rush.yds,'rush yds']];
    case'RB':return[[s.rush.att,'carries'],[s.rush.yds,'rush yds'],[s.rec.rec,'catches'],[s.rec.yds,'rec yds'],[s.rush.td+s.rec.td,'TD']];
    case'WR':case'TE':return[[s.rec.rec+'/'+s.rec.tgt,'catches'],[s.rec.yds,'rec yds'],[s.rec.td,'TD']];
    case'K':return[[s.kick.fg.length+'/'+(s.kick.fg.length+s.kick.fgMiss),'FG'],[Math.max(...s.kick.fg),'long'],[s.kick.xp+'/'+(s.kick.xp+s.kick.xpMiss),'XP']];
    case'D/ST':{const g=GAMES[TEAM_GAME[c.team]];return[[s.dst.sack,'sacks'],[s.dst.int,'INT'],[s.dst.fr,'fum rec'],[g.home===c.team?g.as:g.hs,'pts allowed']]}
    default:{const d=s.idp;return[[d.solo+d.ast,'tackles'],[d.sack,'sacks'],[d.tfl,'TFL'],[d.pd,'PD'],[d.int,'INT']]}
  }
}
const OFFENSE=['QB','RB','WR','TE','K'];
function row(f){
  const c=CATALOG[f.id],g=GAMES[TEAM_GAME[c.team]],home=g.home===c.team,opp=home?g.away:g.home;
  const us=home?g.hs:g.as,them=home?g.as:g.hs,vsTxt=(home?'vs ':'at ')+opp;
  let status;
  if(g.status==='live')status='Q'+g.q+' '+g.clock+', '+c.team+' '+us+' '+opp+' '+them;
  else if(g.status==='final')status=(us>them?'Won ':'Lost ')+us+'-'+them+' '+vsTxt;
  else status='Tonight '+g.kick+' '+vsTxt;
  return{...f,key:f.id+'@'+f.pid,c,g,opp,vsTxt,status,sc:score(f.id,f.pid),chunks:chunks(c),
    rz:g.status==='live'&&g.poss===c.team&&g.ytez<=20&&OFFENSE.includes(c.pos),league:PROFILES[f.pid].name};
}
function groups(){
  const rows=state.followed.map(row);
  return[['live','Live now'],['final','Final'],['pre','Later tonight']].map(([k,t])=>[k,t,rows.filter(r=>r.g.status===k)]).filter(g=>g[2].length);
}
const yardTxt=g=>{const y=g.ytez,def=g.poss===g.home?g.away:g.home;return y<=50?def+' '+y:g.poss+' '+(100-y)};
const themeLabel=()=>document.documentElement.dataset.theme==='dark'?'Light mode':'Dark mode';
const bd=r=>r.sc.parts.length?r.sc.parts.map(([l,v])=>`<div><span>${l}</span><b>${sgn(v)}</b></div>`).join(''):'<div><span>No stats yet</span><b>0.00</b></div>';
const ptsBtn=(r,cls,inner)=>`<button class="${cls} press" data-toggle="${r.key}" data-fk="t-${r.key}" aria-expanded="${state.open.has(r.key)}" aria-label="${fmt(r.sc.total)} fantasy points in ${r.league}, show breakdown">${inner}</button>`;

// ---------- Variant 1: Broadcast ----------
function v1(){
  const gs=groups();
  return `<div class="v1"><div class="top"><div class="wrap"><h1 class="brand">Stat Watch</h1>
    <button class="btn btn-ghost press" data-action="theme" data-fk="theme">${themeLabel()}</button>
    <button class="btn btn-primary press" data-action="add" data-fk="add">Add player</button></div></div>
    <main class="wrap">${gs.length?gs.map(([k,t,rows])=>`<h2>${k==='live'?'<span class="dot"></span>':''}${t}</h2><ul>${rows.map(r=>`
      <li><div class="strip ${r.rz?'is-rz':''}" style="--team:${TEAMS[r.c.team]}">
        <div class="tm"><b>${r.c.num??r.c.team}</b><span>${r.c.num?r.c.pos:'D/ST'}</span></div>
        <div class="who"><p class="nm">${r.c.name}</p>
          <div class="meta">${r.rz?'<span class="rz">Red zone</span>':''}<span>${r.c.num?r.c.team+' '+r.c.pos+', ':''}${r.status}</span><span class="lg">${r.league}</span><button class="rm" data-remove="${r.key}" data-fk="rm-${r.key}" aria-label="Remove ${r.c.name} from ${r.league}">Remove</button></div>
          ${r.g.status==='live'?`<div class="play">${r.g.dd} at ${yardTxt(r.g)}. ${r.g.last}</div>`:''}</div>
        <div class="stats">${r.chunks.map(([v,l])=>`<div class="stat"><b data-k="${r.key}:${l}">${v}</b><span>${l}</span></div>`).join('')||'<div class="stat"><span>No stats until kickoff</span></div>'}</div>
        ${ptsBtn(r,'bug',`<b data-k="${r.key}:total">${fmt(r.sc.total)}</b><span>fantasy pts</span>`)}
      </div>${state.open.has(r.key)?`<div class="brk">${bd(r)}</div>`:''}</li>`).join('')}</ul>`).join(''):empty()}</main></div>`;
}

// ---------- Variant 2: Ledger ----------
function v2(){
  const all=state.followed.map(row),byGame={};
  all.forEach(r=>{(byGame[TEAM_GAME[r.c.team]]??=[]).push(r)});
  const order={live:0,final:1,pre:2};
  const games=Object.entries(byGame).sort((a,b)=>order[GAMES[a[0]].status]-order[GAMES[b[0]].status]);
  const totals=Object.entries(PROFILES).map(([pid,p])=>{const rs=all.filter(r=>r.pid===pid);return`<div class="tot"><b data-k="tot:${pid}">${fmt(rs.reduce((a,r)=>a+r.sc.total,0))}</b><span>${p.name}, ${rs.length} followed</span></div>`}).join('');
  return `<div class="v2"><header class="wrap"><h1>Stat Watch</h1>
    <button class="btn press" data-action="theme" data-fk="theme">${themeLabel()}</button>
    <button class="btn btn-primary press" data-action="add" data-fk="add">Add player</button></header>
    <main class="wrap"><div class="totals">${totals}</div>
    ${games.length?games.map(([gk,rows])=>{const g=GAMES[gk],rz=g.status==='live'&&g.ytez<=20;return`<section class="game">
      <div class="gh"><h2>${g.away} ${g.as??''} at ${g.home} ${g.hs??''}</h2>
        <span class="st ${g.status==='live'?'live':''}">${g.status==='live'?'Live, Q'+g.q+' '+g.clock:g.status==='final'?'Final':'Kickoff '+g.kick}</span>
        ${rz?`<span class="rz">${g.poss} in the red zone</span>`:''}
        ${g.status==='live'?`<span class="play">${g.poss} ball, ${g.dd} at ${yardTxt(g)}. ${g.last}</span>`:''}</div>
      <table><thead><tr><th>Player</th><th class="lgc">League</th><th>Stats</th><th class="num">Pts</th><th class="num"><span class="sr">Remove</span></th></tr></thead><tbody>
      ${rows.map(r=>`<tr class="${r.rz?'is-rz':''}"><td class="pl"><b>${r.c.name}</b><small>${r.c.num?r.c.team+' '+r.c.pos:'Team defense'}</small><div class="lgm"><small style="margin:0">${r.league}</small></div></td>
        <td class="lgc">${r.league}</td>
        <td class="line">${r.chunks.map(([v,l])=>`<span><b data-k="${r.key}:${l}">${v}</b><i>${l}</i></span>`).join('')||'<span><i style="margin:0">No stats until kickoff</i></span>'}</td>
        <td class="num">${ptsBtn(r,'pts',`<span data-k="${r.key}:total">${fmt(r.sc.total)}</span>`)}</td>
        <td class="num"><button class="rm" data-remove="${r.key}" data-fk="rm-${r.key}" aria-label="Remove ${r.c.name} from ${r.league}">×</button></td></tr>
        ${state.open.has(r.key)?`<tr class="brk"><td colspan="5"><dl>${r.sc.parts.map(([l,v])=>`<div><dt>${l}</dt><dd>${sgn(v)}</dd></div>`).join('')||'<div><dt>No stats yet</dt><dd>0.00</dd></div>'}</dl></td></tr>`:''}`).join('')}
      </tbody></table></section>`}).join(''):empty()}</main></div>`;
}

// ---------- Variant 3: Field ----------
const ballX=g=>8.3333+(100-g.ytez)*.83333;
function v3(){
  const gs=groups();
  return `<div class="v3"><header class="wrap"><h1>Stat Watch</h1>
    <button class="btn press" data-action="theme" data-fk="theme">${themeLabel()}</button>
    <button class="btn btn-primary press" data-action="add" data-fk="add">Add player</button></header>
    <main class="wrap">${gs.length?gs.map(([k,t,rows])=>`<h2>${t}</h2><ul class="grid ${k}">${rows.map(r=>{const g=r.g,def=g.poss===g.home?g.away:g.home;return`
      <li class="card ${k} ${r.rz?'is-rz':''}" style="--team:${TEAMS[r.c.team]}">
        <div class="hd"><div class="badge" aria-hidden="true">${r.c.team}</div>
          <div class="id"><p class="nm">${r.c.name}</p><div class="sub"><span>${r.c.num?r.c.pos+', '+r.vsTxt:'Team defense, '+r.vsTxt}</span><span class="chip">${r.league}</span></div></div>
          ${ptsBtn(r,'pts',`<b data-k="${r.key}:total">${fmt(r.sc.total)}</b><span>fantasy pts</span>`)}</div>
        ${g.status==='live'?`<div class="field" style="--own:${TEAMS[g.poss]};--opp:${TEAMS[def]}" role="img" aria-label="${g.poss} ball at ${yardTxt(g)}, ${g.dd}">
            <div class="ez l">${g.poss}</div><div class="ez r">${def}</div><div class="rzone"></div>
            <div class="ballrail" data-ball="${TEAM_GAME[r.c.team]}" data-x="${ballX(g)}" data-poss="${g.poss}"><div class="los"></div><div class="ball"></div></div></div>
          <div class="dd"><span><b>Q${g.q} ${g.clock}</b>, ${g.away} ${g.as} at ${g.home} ${g.hs}</span><span>${r.rz?'<span class="rzt">Red zone</span> ':''}${g.poss} ball, ${g.dd} at ${yardTxt(g)}</span></div>
          <div class="dd"><span>${g.last}</span></div>`
        :`<div class="score">${g.status==='final'?`<b>${r.status.split(' ')[0]}</b> ${r.status.split(' ').slice(1).join(' ')}`:`Kickoff <b>${g.kick}</b> tonight`}</div>`}
        <div class="stats">${r.chunks.map(([v,l])=>`<div class="stat"><b data-k="${r.key}:${l}">${v}</b><span>${l}</span></div>`).join('')||'<div class="stat"><span>No stats until kickoff</span></div>'}</div>
        ${state.open.has(r.key)?`<div class="brk">${bd(r)}</div>`:''}
        <div class="ft"><button class="rm" data-remove="${r.key}" data-fk="rm-${r.key}" aria-label="Remove ${r.c.name} from ${r.league}">Remove</button></div>
      </li>`}).join('')}</ul>`).join(''):empty()}</main></div>`;
}

const empty=()=>`<div class="empty"><p>You're not following anyone yet. Add players or team defenses from any of your leagues.</p><button class="btn btn-primary press" data-action="add" data-fk="add">Add player</button></div>`;

// ---------- Render with change highlighting ----------
const variants=[v1,v2,v3];
const stage=document.getElementById('stage');
let prevVals=new Map(),prevBall=new Map(),firstRender=true;
function render(){
  const fk=document.activeElement?.dataset?.fk;
  stage.innerHTML=variants[state.variant]();
  const next=new Map();
  stage.querySelectorAll('[data-k]').forEach(el=>{const k=el.dataset.k,v=el.textContent;next.set(k,v);if(!firstRender&&prevVals.has(k)&&prevVals.get(k)!==v)el.classList.add('bump')});
  prevVals=next;firstRender=false;
  // The ball glides from its previous spot; a change of possession jumps instead.
  const nb=new Map();
  stage.querySelectorAll('[data-ball]').forEach(el=>{
    const id=el.dataset.ball+el.dataset.poss,x=+el.dataset.x,from=prevBall.get(id);
    nb.set(id,x);
    el.style.transform=`translateX(${from??x}%)`;
    if(from!=null&&from!==x)requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.transform=`translateX(${x}%)`}));
  });
  prevBall=nb;
  if(fk)stage.querySelector(`[data-fk="${CSS.escape(fk)}"]`)?.focus();
}
function mount(i){state.variant=i;document.body.dataset.variant=i+1;firstRender=true;prevBall=new Map();render()}

// ---------- Live simulation of DEN at SF ----------
const S=id=>CATALOG[id].s,G=GAMES.densf;
const snap=JSON.stringify({p:S('purdy'),c:S('cmc'),w:S('warner'),g:G});
const EVENTS=[
  ()=>{S('purdy').pass.cmp++;S('purdy').pass.att++;S('purdy').pass.yds+=7;S('cmc').rec.rec++;S('cmc').rec.tgt++;S('cmc').rec.yds+=7;Object.assign(G,{ytez:5,dd:'1st & Goal',clock:'6:02',last:'B.Purdy pass short left to C.McCaffrey for 7 yards'})},
  ()=>{S('cmc').rush.att++;S('cmc').rush.yds+=5;S('cmc').rush.td++;Object.assign(G,{hs:G.hs+7,poss:'DEN',ytez:75,dd:'1st & 10',clock:'5:21',last:'C.McCaffrey 5 yard run up the middle, TOUCHDOWN'})},
  ()=>{S('warner').idp.solo++;Object.assign(G,{ytez:68,dd:'2nd & 3',clock:'4:50',last:'J.Dobbins rush right for 7 yards, tackled by F.Warner'})},
  ()=>{S('warner').idp.pd++;Object.assign(G,{dd:'3rd & 3',clock:'4:44',last:'B.Nix pass incomplete short middle, broken up by F.Warner'})},
  ()=>{const w=S('warner').idp;w.sack++;w.tfl++;w.qbHit++;w.solo++;Object.assign(G,{poss:'SF',ytez:70,dd:'1st & 10',clock:'3:58',last:'B.Nix sacked by F.Warner for -8 yards. DEN punts, fair catch at SF 30'})},
  ()=>{S('purdy').pass.cmp++;S('purdy').pass.att++;S('purdy').pass.yds+=34;Object.assign(G,{ytez:36,clock:'3:31',last:'B.Purdy pass deep left to J.Jennings for 34 yards'})},
  ()=>{S('purdy').pass.cmp++;S('purdy').pass.att++;S('purdy').pass.yds+=18;Object.assign(G,{ytez:18,clock:'2:55',last:'B.Purdy pass short right to G.Kittle for 18 yards'})},
  ()=>{S('purdy').rush.att++;S('purdy').rush.yds+=6;Object.assign(G,{ytez:12,dd:'2nd & 4',clock:'2:19',last:'B.Purdy scrambles right for 6 yards'})},
  ()=>{const o=JSON.parse(snap);CATALOG.purdy.s=o.p;CATALOG.cmc.s=o.c;CATALOG.warner.s=o.w;Object.assign(G,o.g)}
];
let ev=0;setInterval(()=>{EVENTS[ev]();ev=(ev+1)%EVENTS.length;render()},3500);

// ---------- Interactions ----------
const root=document.documentElement;
try{root.dataset.theme=localStorage.getItem('proto-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light')}catch{root.dataset.theme='light'}
const dlg=document.getElementById('add'),q=document.getElementById('q'),pf=document.getElementById('pf'),results=document.getElementById('results');
pf.innerHTML=Object.entries(PROFILES).map(([k,p])=>`<option value="${k}">${p.name}</option>`).join('');
function renderResults(){
  const t=q.value.trim().toLowerCase();
  const hits=Object.entries(CATALOG).filter(([,c])=>!t||c.name.toLowerCase().includes(t)||c.team.toLowerCase()===t);
  results.innerHTML=hits.length?hits.map(([id,c])=>{const has=state.followed.some(f=>f.id===id&&f.pid===pf.value);return`<li><span class="r"><b>${c.name}</b><small>${c.num?c.team+' '+c.pos:'Team defense'}</small></span><button type="button" class="add press" data-add="${id}" ${has?'disabled':''}>${has?'Added':'Add'}</button></li>`}).join(''):`<li class="none">No player or team matches that search. Try a last name or a team like SF.</li>`;
}
q.addEventListener('input',renderResults);pf.addEventListener('change',renderResults);
results.addEventListener('click',e=>{const id=e.target.closest('[data-add]')?.dataset.add;if(!id)return;state.followed.push({id,pid:pf.value});renderResults();render()});
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-action],[data-remove],[data-toggle]');if(!t||!stage.contains(t))return;
  if(t.dataset.action==='add'){q.value='';renderResults();dlg.showModal();q.focus()}
  else if(t.dataset.action==='theme'){root.dataset.theme=root.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('proto-theme',root.dataset.theme)}catch{}render()}
  else if(t.dataset.remove){const[id,pid]=t.dataset.remove.split('@');state.followed=state.followed.filter(f=>!(f.id===id&&f.pid===pid));render()}
  else if(t.dataset.toggle){const k=t.dataset.toggle;state.open.has(k)?state.open.delete(k):state.open.add(k);render()}
});

// ---------- Picker (reference wiring) ----------
const picker=document.querySelector('.proto-picker');
const highlight=picker.querySelector('.proto-picker-highlight');
const items=[...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
let current=0;
function moveHighlight(){const el=items[current];highlight.style.width=el.offsetWidth+'px';highlight.style.transform=`translateX(${el.offsetLeft}px)`}
function setActive(i){
  if(i<0||i>=variants.length)return;current=i;
  items.forEach((el,j)=>{el.toggleAttribute('data-active',j===i);if(j===i)el.setAttribute('aria-current','true');else el.removeAttribute('aria-current')});
  moveHighlight();const url=new URL(location);url.searchParams.set('v',i+1);history.replaceState(null,'',url);mount(i);
}
items.forEach((el,i)=>el.addEventListener('click',()=>setActive(i)));
window.addEventListener('resize',moveHighlight);
document.addEventListener('keydown',e=>{
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable||dlg.open)return;
  if(e.metaKey||e.ctrlKey||e.altKey)return;
  const num=parseInt(e.key,10);
  if(num>=1&&num<=variants.length)setActive(num-1);
  else if(e.key==='ArrowRight')setActive((current+1)%variants.length);
  else if(e.key==='ArrowLeft')setActive((current-1+variants.length)%variants.length);
});
setActive((parseInt(new URLSearchParams(location.search).get('v'),10)||1)-1);
requestAnimationFrame(()=>requestAnimationFrame(()=>picker.setAttribute('data-ready','')));
</script>
</body>
