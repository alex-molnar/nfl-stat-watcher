apiVersion: apps/v1
kind: Deployment
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stat-watch
  template:
    metadata:
      labels:
        app: stat-watch
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # Set this to the image you pushed to your registry.
          image: registry.example.com/stat-watch:0.1.0
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  type: ClusterIP
  selector:
    app: stat-watch
  ports:
    - name: http
      port: 80
      targetPort: http
