apiVersion: apps/v1
kind: Deployment
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stat-watch
  template:
    metadata:
      labels:
        app: stat-watch
    spec:
      automountServiceAccountToken: false
      # Only needed when the GHCR package is private; see docs/deployment.md. A missing secret is only a warning.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The pipeline substitutes the image (ghcr.io/<owner>/<repo>:<commit>) before applying this file.
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
        # Counts the anonymous usage events nginx forwards from /api/e and serves them to Prometheus (docs/metrics.md).
        # Its counters live in memory, so this stays one replica: with more, each pod would count only part of the tabs.
        - name: collector
          image: ${COLLECTOR_IMAGE}
          ports:
            - name: metrics
              containerPort: 9100
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /metrics
              port: metrics
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 48Mi
            limits:
              cpu: 100m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  type: ClusterIP
  selector:
    app: stat-watch
  ports:
    - name: http
      port: 80
      targetPort: http
    # Only for Prometheus: the Ingress below routes to `http` alone, so the metrics are not on the internet.
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stat-watch
  labels:
    app: stat-watch
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - ${HOST}
      secretName: stat-watch-tls
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stat-watch
                port:
                  name: http
---
# Prometheus scrapes the collector through the Service's `metrics` port. Last in the file so everything else is applied even if this one is refused (see docs/deployment.md).
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  selector:
    matchLabels:
      app: stat-watch
  endpoints:
    - port: metrics
      interval: 30s
