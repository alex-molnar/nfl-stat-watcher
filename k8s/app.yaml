apiVersion: apps/v1
kind: Deployment
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  replicas: 1
  selector:
    matchLabels:
      app: stat-watch
  template:
    metadata:
      labels:
        app: stat-watch
    spec:
      automountServiceAccountToken: false
      # Only needed when the GHCR package is private; see docs/deployment.md. A missing secret is only a warning.
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # The pipeline fills ${IMAGE} (ghcr.io/<owner>/<repo>:<commit>) before applying this file.
          image: ${IMAGE}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  type: ClusterIP
  selector:
    app: stat-watch
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: stat-watch
  labels:
    app: stat-watch
spec:
  # The pipeline fills ${INGRESS_CLASS} and ${HOST} from the GitHub environment's variables.
  ingressClassName: ${INGRESS_CLASS}
  rules:
    - host: ${HOST}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: stat-watch
                port:
                  name: http
