# Every push or merge to main goes to the live namespace.
name: Deploy live

on:
  push:
    branches:
      - main

# Live deployments run one at a time and are never cancelled half way.
concurrency:
  group: deploy-live
  cancel-in-progress: false

permissions:
  contents: read
  packages: write # the shared workflow pushes the image; a called workflow cannot hold more than its caller

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: live
      namespace: nfl-stat-watcher
