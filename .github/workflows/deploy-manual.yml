# Started by hand from the Actions tab. "Use workflow from" picks the branch; its tip is what gets deployed.
name: Deploy manually

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Where to deploy the selected branch
        required: true
        type: choice
        options:
          - test
          - live

# Shares its group with the automatic pipeline of the same environment, so the two never deploy at once.
# A test deployment replaces one still in progress; a live one is never cancelled half way.
concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: ${{ inputs.environment == 'test' }}

permissions:
  contents: read
  packages: write # the shared workflow pushes the image; a called workflow cannot hold more than its caller

jobs:
  deploy:
    uses: ./.github/workflows/_deploy.yml
    with:
      environment: ${{ inputs.environment }}
      namespace: ${{ inputs.environment == 'live' && 'nfl-stat-watcher' || 'nfl-stat-watcher-test' }}
    # Required: a called workflow only sees the secrets its caller passes (see deploy-test.yml).
    secrets: inherit
