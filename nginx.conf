server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Vite emits content-hashed files here; they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Anonymous usage events go to the collector sidecar in the same pod, which turns them into Prometheus metrics (docs/metrics.md).
  # Not logged, so no visitor IP ends up in the access log for them. If the collector is down the app does not notice: it never waits for the answer.
  location = /api/e {
    limit_except POST { deny all; }
    client_max_body_size 2k;
    access_log off;
    proxy_connect_timeout 1s;
    proxy_pass http://127.0.0.1:9100/e;
  }

  # Client-side routes such as /settings fall back to the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
