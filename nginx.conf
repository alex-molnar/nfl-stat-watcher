server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;

  # Vite emits content-hashed files here; they never change.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Anonymous usage events go to the collector sidecar in the same pod, which turns them into Prometheus metrics (docs/metrics/metrics.md).
  # Not logged, so no visitor IP ends up in the access log for them. If the collector is down the app does not notice: it never waits for the answer.
  location = /api/e {
    limit_except POST { deny all; }
    client_max_body_size 2k;
    access_log off;
    proxy_connect_timeout 1s;
    proxy_pass http://127.0.0.1:9100/e;
  }

  # DAZN's schedule page, read by the app when the user turns on "Expose DAZN games" in Settings.
  # The browser cannot call dazn.com itself (it sends no CORS headers), so this server does.
  location /dazn/ {
    proxy_pass https://www.dazn.com/;
    proxy_ssl_server_name on;
    proxy_set_header Host www.dazn.com;
    # Browser-like user agents get DAZN's client-rendered shell without the schedule; other agents get the full page.
    proxy_set_header User-Agent "StatWatch/1.0";
    proxy_set_header Accept-Encoding "";
    proxy_read_timeout 15s;
    add_header Cache-Control "no-store";
  }

  # Client-side routes such as /settings fall back to the app.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
